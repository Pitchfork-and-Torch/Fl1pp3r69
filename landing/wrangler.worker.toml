# Production path for fl1pp3r69.jonbailey.xyz (Workers Static Assets).
# Single deploy -- do not use a separate Pages custom domain for this hostname.
#
# Deploy:
#   npx wrangler deploy -c wrangler.worker.toml
#
# Optional preview (pages.dev only, no custom domain):
#   npx wrangler pages deploy . --project-name=fl1pp3r69 --branch=main --commit-dirty=true

name = "fl1pp3r69-site"
main = "worker.js"
compatibility_date = "2026-07-01"
workers_dev = false

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

[[routes]]
pattern = "fl1pp3r69.jonbailey.xyz"
custom_domain = true
